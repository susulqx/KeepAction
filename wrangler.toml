name = "keepaction"
main = "_worker.js"
compatibility_date = "2024-09-23"

# 必须：KV 命名空间绑定，变量名一定是 KeepAction（与 _worker.js 中 env.KeepAction 对应）
# 把下面的 id 换成你自己的 KV 命名空间 ID
# 获取方式：wrangler kv namespace create KeepAction  （或 Dashboard → KV → 命名空间详情里的 ID）
#[[kv_namespaces]]
#binding = "KeepAction"
#id = "在此填写你的_KV_命名空间_ID"

# 定时触发器（对应 worker 的 scheduled 方法）
# 示例：保活每月 1 号 0 点；同步每天 12 点（按自己需求调整）
[triggers]
crons = [
  "0 0 1 * *",
  "0 12 * * *"
]
